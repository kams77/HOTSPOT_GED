<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>HotSpot Pro Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: console d'opérateur — rail de navigation sombre à gauche, plan de travail clair à droite ; sur téléphone, le rail devient une barre défilante en haut. */
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#e8eef0; --line:#d4dde0; --fg:#13232a; --muted:#5a6b73;
  --accent:#0d6e66; --accent-fg:#ffffff; --accent-soft:#d5ebe8; --bar2:#d18a1f;
  --ok:#1d7439; --okbg:#dbeee1; --warn:#865600; --warnbg:#f9eac6; --bad:#b0251d; --badbg:#f7d9d6; --mutebg:#e5eaec;
  --side:#0f2a33; --side-fg:#c9dfe2; --side-dim:#7f9ca2; --side-active:#1c4753;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1518; --surface:#132025; --surface2:#19292f; --line:#25383e; --fg:#e2ebed; --muted:#91a5ac;
  --accent:#3db5a6; --accent-fg:#05201c; --accent-soft:#153a3a; --bar2:#e0a33a;
  --ok:#72d18f; --okbg:#163324; --warn:#f0c062; --warnbg:#382c10; --bad:#ff8b80; --badbg:#3c1b19; --mutebg:#203036;
  --side:#091114; --side-fg:#b8ccd0; --side-dim:#6b858b; --side-active:#163238; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1518; --surface:#132025; --surface2:#19292f; --line:#25383e; --fg:#e2ebed; --muted:#91a5ac;
  --accent:#3db5a6; --accent-fg:#05201c; --accent-soft:#153a3a; --bar2:#e0a33a;
  --ok:#72d18f; --okbg:#163324; --warn:#f0c062; --warnbg:#382c10; --bad:#ff8b80; --badbg:#3c1b19; --mutebg:#203036;
  --side:#091114; --side-fg:#b8ccd0; --side-dim:#6b858b; --side-active:#163238; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:20px;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.05rem;color:#fff;letter-spacing:.01em;display:block;line-height:1.1}
.brand small{color:var(--side-dim);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group > span{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--side-dim);padding:0 8px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--side-fg);text-decoration:none;padding:7px 8px;border-radius:6px;font-weight:500;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--side-active);color:#fff}
.nav a em{font-style:normal;font-size:.72rem;font-family:var(--f-mono);background:rgba(255,255,255,.1);padding:0 6px;border-radius:9px}
.side-foot{margin-top:auto;font-size:.75rem;color:var(--side-dim);padding:0 8px;display:flex;flex-direction:column;gap:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}

main{min-width:0;padding-block:26px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{color:var(--muted);margin-top:4px;max-width:65ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:.82rem}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.pri.danger{background:var(--bad);border-color:var(--bad);color:#fff}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:first-child{border-left:0}
.kpi span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{color:var(--muted);font-size:.8rem}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
.filters .inp[type=search]{flex:1 1 220px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:600;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface2);padding:8px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap-c{white-space:normal;min-width:180px}
tr:hover td{background:color-mix(in srgb, var(--accent-soft) 35%, transparent)}
td .row-act{display:flex;gap:4px;justify-content:flex-end}
.empty{padding:28px;text-align:center;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--okbg);color:var(--ok)} .warn{background:var(--warnbg);color:var(--warn)}
.bad{background:var(--badbg);color:var(--bad)} .mute{background:var(--mutebg);color:var(--muted)}
.info{background:var(--accent-soft);color:var(--accent)}

.meter{width:110px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.hi{background:var(--bad)}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li > div{min-width:0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border-left:4px solid}
.alert.warn{border-color:var(--warn)} .alert.bad{border-color:var(--bad)} .alert.info{border-color:var(--accent)}

.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b1{fill:var(--accent)} .chart .b2{fill:var(--bar2)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.hbar .track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:5px}

.attr{background:var(--surface2);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:.82rem;overflow-x:auto;white-space:pre;margin:0;line-height:1.6}
.attr .k{color:var(--accent)} .attr .c{color:var(--muted)}

/* Planche de tickets */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ticket{border:1.5px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.ticket .tk-h{display:flex;justify-content:space-between;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ticket code{font-family:var(--f-mono);font-size:1.15rem;font-weight:500;letter-spacing:.12em;color:var(--fg)}
.ticket small{color:var(--muted);font-size:.75rem}

/* Portail captif */
.portal-wrap{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.portal-wrap{grid-template-columns:minmax(0,1fr)}}
.phone{border:10px solid #1a2328;border-radius:30px;background:#f7faf9;color:#14232a;overflow:hidden;max-width:360px;width:100%;margin:0 auto;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.phone .ph-top{background:#0d6e66;color:#fff;padding:22px 18px 18px;display:flex;flex-direction:column;gap:4px}
.phone .ph-top b{font-family:var(--f-display);font-size:1.25rem}
.phone .ph-top span{font-size:.82rem;opacity:.85}
.phone .ph-body{padding:16px 18px 22px;display:flex;flex-direction:column;gap:12px;min-height:400px}
.phone .tabs{display:grid;grid-template-columns:1fr 1fr;background:#e2ebe9;border-radius:8px;padding:3px}
.phone .tabs button{border:0;background:transparent;padding:7px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem;color:#3c5058}
.phone .tabs button.on{background:#fff;color:#0d6e66}
.phone label{font-size:.78rem;font-weight:600;color:#3c5058;display:flex;flex-direction:column;gap:4px}
.phone input,.phone select{border:1px solid #c5d3d1;border-radius:8px;padding:10px;background:#fff;color:#14232a;font-size:.95rem}
.phone .go{background:#0d6e66;color:#fff;border:0;border-radius:8px;padding:11px;font-weight:600;cursor:pointer;font-size:.95rem}
.phone .msg{font-size:.82rem;padding:8px 10px;border-radius:6px}
.phone .msg.e{background:#f7d9d6;color:#9a1f18}
.phone .msg.s{background:#dbeee1;color:#1d6332}
.phone .ops{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.phone .ops label{flex-direction:row;align-items:center;justify-content:center;gap:4px;border:1px solid #c5d3d1;border-radius:8px;padding:8px 4px;cursor:pointer;background:#fff;font-size:.75rem}
.phone .ops input{padding:0}
.phone .hint{font-size:.74rem;color:#5a6b73}
.phone .hint button{border:0;background:#e2ebe9;font-family:var(--f-mono);font-size:.72rem;border-radius:4px;padding:1px 5px;cursor:pointer;color:#14232a;margin:2px}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:500;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.8rem}

/* Formulaires */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-weight:500}
.perm td{text-align:center} .perm td:first-child{text-align:left}

/* Modale & toast */
.ov{position:fixed;inset:0;background:rgba(6,16,20,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:90vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:60;max-width:calc(100% - 32px);font-weight:500}


.sw{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;vertical-align:middle}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw:checked{background:var(--accent)} .sw:checked::after{left:16px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0} .opt > div{min-width:0}
.adbox{border-radius:10px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:4px;background:linear-gradient(135deg,#0d6e66,#164f7a);color:#fff}
.adbox small{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.adbox b{font-family:var(--f-display);font-size:1.2rem}
.note{font-size:.82rem;color:var(--muted);background:var(--surface2);padding:10px 12px;border-radius:8px}

.topbar{max-width:1180px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative;flex:1 1 280px;min-width:0}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .inp{width:100%;padding-left:32px;padding-right:30px}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);pointer-events:none}
.gsr{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:30;max-height:60vh;overflow-y:auto;padding:6px}
.gsr h4{margin:8px 8px 2px;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.gsr button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--fg)}
.gsr button:hover,.gsr button:focus-visible{background:var(--surface2)}
.gsr button small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th[aria-sort=ascending]::after{content:" ▲";font-size:.6rem}
th[aria-sort=descending]::after{content:" ▼";font-size:.6rem}
.pager{display:flex;justify-content:center;padding-top:10px}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left;font-size:inherit}
.lnk:hover{text-decoration:underline}
.scrim{position:fixed;inset:0;background:rgba(6,16,20,.4);z-index:39}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:40;overflow-y:auto;padding-block:calc(20px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px;box-shadow:-14px 0 40px rgba(0,0,0,.2)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini > div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.mini span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mini b{font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.mini small{color:var(--muted);font-size:.76rem}
.form .full{grid-column:1/-1}
.codebig{font-family:var(--f-mono);font-size:clamp(1.5rem,6vw,2.2rem);letter-spacing:.14em;text-align:center;padding:18px 10px;border:2px dashed var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--fg);font-weight:500}
@media (max-width:860px){
  .app{display:block}
  .side{position:sticky;top:env(safe-area-inset-top, 0px);height:auto;z-index:20;padding-block:10px;padding-right:max(16px, env(safe-area-inset-right, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));flex-direction:row;align-items:center;gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:21;background:var(--side)}
  .brand small,.side-foot,.nav-group > span{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;min-width:0;scrollbar-width:none}
  .nav-group{flex-direction:row}
  .brand b{font-size:.95rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="21" r="2.6" fill="#3db5a6"/><path d="M8.5 15.5a9 9 0 0 1 13 0" stroke="#3db5a6" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M4 11a15 15 0 0 1 22 0" stroke="#3db5a6" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"/></svg>
      <div><b>HotSpot Pro</b><small>Console RADIUS</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span><span class="dot"></span>FreeRADIUS 3.2 · en service</span>
      <span>Auth 1812 · Acct 1813</span>
      <span>Données de démonstration</span>
    </div>
  </aside>
  <main><div class="topbar" id="topbar"></div><div class="wrap" id="main"></div></main>
</div>
<div class="ov" id="ov" hidden><form class="modal" id="mform"><h2 id="mtitle"></h2><div id="mbody"></div><div class="modal-f"><button type="button" class="btn" id="mcancel">Annuler</button><button class="btn pri" id="mok">Enregistrer</button></div></form></div>
<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden></div><aside class="drawer" id="drawer" hidden aria-label="Fiche client"></aside>

<script>
/* ---------- Utilitaires ---------- */
let seed=20261111;const r=()=>(seed=seed*16807%2147483647)/2147483647;
const ri=(a,b)=>a+Math.floor(r()*(b-a+1)), pick=a=>a[Math.floor(r()*a.length)];
const MIN=60000, DAY=86400000, NOW=Date.now();
const $=s=>document.querySelector(s);

 const tp=S.topups.filter(t=>t.status==='en attente').length;if(tp)alerts.push(['warn',`${tp} demande(s) de recharge revendeur à valider.`,'revendeurs']);
 if(soon)alerts.push(['info',`${soon} utilisateur(s) expirent dans les prochaines 24 h.`,'utilisateurs']);
 alerts.splice(0,alerts.length,...alerts.filter(a=>canView(a[2])));
 return head('Tableau de bord',`Vue d'ensemble du réseau au ${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}.`,`<a class="btn" href="#vouchers">Générer des tickets</a><a class="btn pri" href="#utilisateurs">Nouvel utilisateur</a>`)+
 `<div class="kpis">

 </div>

  <section class="panel"><h2>À traiter</h2>${alerts.length?`<div class="list" style="gap:8px">${alerts.map(([k,t,l])=>`<a href="#${l}" class="alert ${k}" style="text-decoration:none;color:inherit;background:var(--surface2)"><span>${t}</span></a>`).join('')}</div>`:'<p class="muted">Rien à signaler.</p>'}</section>

  <section class="panel"><div class="panel-h"><h2>Derniers paiements</h2><a class="btn sm" href="#paiements">Tout voir</a></div><div class="list">${S.payments.slice(0,6).map(p=>`<div class="li"><div><span class="mono">${esc(p.phone)}</span><br><small class="muted">${esc(p.op)} · ${esc(plan(p.plan).name)} · ${dt(p.date)}</small></div><div style="text-align:right"><b class="num">${fc(p.amount)}</b><br>${stPay(p.status)}</div></div>`).join('')}</div></section>
 </div>`;
};
function chart(){const W=640,H=230,L=52,B=26,T=10,R=6,max=Math.max(...S.daily.map(d=>d.v+d.m)),top=Math.ceil(max/20000)*20000,bw=(W-L-R)/14,y=v=>H-B-(v/top)*(H-B-T);
 let g='';[0,top/2,top].forEach(v=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${(v/1000).toLocaleString('fr-FR')}k</text>`});
 S.daily.forEach((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;g+=`<rect class="b1" x="${x}" y="${y(d.v)}" width="${w}" height="${y(0)-y(d.v)}" rx="2"><title>${d0(d.date)} · Tickets ${fc(d.v)}</title></rect><rect class="b2" x="${x}" y="${y(d.v+d.m)}" width="${w}" height="${y(d.v)-y(d.v+d.m)}" rx="2"><title>${d0(d.date)} · Mobile Money ${fc(d.m)}</title></rect>`;if(i%2===1||i===13)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${new Date(d.date).getDate()}</text>`});
 return`<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Recettes quotidiennes en francs congolais">${g}</svg></div>`}

 curList=()=>{const b=F.vb||'',st=F.vs||'',q=(F.vq||'').toUpperCase();const list=S.vouchers.filter(v=>(!b||v.batch===b)&&(!st||v.status===st)&&v.code.includes(q));

 <section class="panel"><h2>Configuration côté routeur</h2><p class="muted">À reporter dans l'interface du routeur pour qu'il utilise ce serveur.</p><pre class="attr"><span class="k">Serveur RADIUS</span>        IP publique ou VPN du serveur

/* ---------- Portail captif ---------- */
let PT='code',PMSG='',PRES='',SMSS=null;
const PTABS={voucher:['code','Ticket'],momo:['momo','Acheter'],free:['free','Gratuit'],sms:['sms','SMS']};
const loginOn=k=>S.login.find(l=>l.k===k)?.on;
function phRender(){const e=$('#phb');if(e)e.innerHTML=PRES}
VIEWS.portail=()=>{const demo=S.vouchers.filter(v=>v.status==='disponible').slice(0,3);
 const tabs=S.login.filter(l=>l.on&&PTABS[l.k]).map(l=>PTABS[l.k]);
 if(tabs.length&&!tabs.some(t=>t[0]===PT))PT=tabs[0][0];
 const smsUser=S.users.find(u=>u.status==='actif'&&u.phone);
 let body='';
 if(!tabs.length)body='<p class="msg e">Aucune méthode de connexion activée.</p>';
 else if(PT==='code')body=`<form id="pcode" style="display:flex;flex-direction:column;gap:12px"><label>Code du ticket<input id="pc" name="c" class="mono" placeholder="XXXX-XXXX" autocomplete="off" required style="letter-spacing:.1em;text-transform:uppercase"></label><button class="go">Se connecter</button></form><p class="hint">Codes disponibles pour l'essai : ${demo.map(v=>`<button type="button" data-act="pfill" data-id="${v.code}">${v.code}</button>`).join('')}</p>`;
 else if(PT==='momo')body=`<form id="pmomo" style="display:flex;flex-direction:column;gap:12px"><label>Forfait<select name="plan">${S.plans.filter(p=>!p.free).map(p=>`<option value="${p.id}">${esc(p.name)} — ${fc(p.price)}</option>`).join('')}</select></label><div><span style="font-size:.78rem;font-weight:600;color:#3c5058">Opérateur</span><div class="ops">${Object.keys(OPS).map((o,i)=>`<label><input type="radio" name="op" value="${o}" ${i?'':'checked'}>${o.split(' ')[0]}</label>`).join('')}</div></div><label>Numéro Mobile Money<input name="phone" placeholder="+243 81 234 5678" required inputmode="tel"></label><button class="go">Payer</button><p class="hint">Vous recevrez une demande de confirmation sur votre téléphone. Saisissez votre code PIN pour valider.</p></form>`;
 else if(PT==='free')body=`<div style="display:flex;flex-direction:column;gap:10px"><p style="font-size:.9rem">Profitez de <b>${S.free.min} min</b> et <b>${S.free.mb} Mo</b> gratuits par jour, offerts par nos partenaires.</p><button type="button" class="go" data-act="pfree">Regarder une publicité de ${S.free.adSec} s</button><p class="hint">Débit limité à 1 Mbit/s. Un accès par appareil et par jour.</p></div>`;
 else if(PT==='sms')body=SMSS?`<form id="psms2" style="display:flex;flex-direction:column;gap:12px"><label>Code reçu par SMS<input name="otp" inputmode="numeric" maxlength="6" required class="mono" style="letter-spacing:.3em"></label><button class="go">Valider</button></form><p class="hint">Démo : le code envoyé est <b class="mono">${SMSS.otp}</b>. <button type="button" data-act="psmsback">Changer de numéro</button></p>`
  :`<form id="psms1" style="display:flex;flex-direction:column;gap:12px"><label>Votre numéro<input name="phone" required inputmode="tel" placeholder="+243 81 234 5678"></label><button class="go">Recevoir un code</button></form><p class="hint">Numéro d'un client actif pour l'essai : <button type="button" data-act="pfillp" data-id="${esc(smsUser?.phone||'')}">${esc(smsUser?.phone||'')}</button></p>`;
 const social=loginOn('social')?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${['Google','Facebook'].map(x=>`<button type="button" class="go" style="background:#fff;color:#14232a;border:1px solid #c5d3d1" data-act="psocial" data-id="${x}">${x}</button>`).join('')}</div>`:'';
 return head('Portail captif','Page que voient vos clients en se connectant au Wi-Fi. Cet aperçu fonctionne : essayez chaque méthode, puis regardez Utilisateurs, Sessions et Mobile Money.')+
 `<div class="portal-wrap"><div class="phone"><div class="ph-top"><b>${esc(S.settings.portalTitle)}</b><span>${esc(S.settings.portalMsg)}</span></div><div class="ph-body" id="phb">
 ${PRES?PRES:`${tabs.length?`<div class="tabs" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map(([k,l])=>`<button type="button" data-act="ptab" data-id="${k}" class="${PT===k?'on':''}">${l}</button>`).join('')}</div>`:''}${PMSG}${body}${social}`}
 </div></div>
 <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
 <section class="panel"><h2>Méthodes de connexion</h2><p class="muted">Activez ce que vos clients peuvent utiliser. Les changements s'appliquent immédiatement à l'aperçu.</p><div>${S.login.map(l=>`<div class="opt"><div><b>${esc(l.n)}</b><p class="muted" style="font-size:.84rem">${esc(l.d)}</p></div><input type="checkbox" class="sw" id="lg_${l.k}" data-act="login" data-id="${l.k}" ${l.on?'checked':''} aria-label="${esc(l.n)}"></div>`).join('')}</div></section>
 <section class="panel"><h2>Ce qui se passe à la connexion</h2><ol class="steps">
  <li><div><b>Redirection</b><p class="muted">Le routeur intercepte la première page web et affiche ce portail. Le portail et les passerelles de paiement restent accessibles sans connexion (walled garden).</p></div></li>
  <li><div><b>Access-Request</b><p class="muted">Le routeur envoie le code, l'identifiant ou l'adresse MAC au serveur RADIUS sur le port ${S.settings.auth}.</p></div></li>
  <li><div><b>Contrôles</b><p class="muted">Statut du compte, expiration, volume restant, plage horaire et nombre d'appareils.</p></div></li>
  <li><div><b>Access-Accept</b><p class="muted">Le serveur renvoie la durée, le débit et le quota. Le routeur ouvre l'accès Internet.</p></div></li>
  <li><div><b>Comptabilité</b><p class="muted">Start, puis Interim toutes les ${S.settings.interim} s, puis Stop. Les compteurs alimentent Sessions, Analytique et Conformité.</p></div></li>
 </ol></section>
 <section class="panel"><h2>Personnaliser</h2><div class="form"><label class="full">Titre affiché<input class="inp" id="pt_title" value="${esc(S.settings.portalTitle)}"></label><label class="full">Message d'accueil<input class="inp" id="pt_msg" value="${esc(S.settings.portalMsg)}"></label><label>Langue du portail${sel('pt_lang',[['fr','Français'],['ln','Lingala'],['sw','Swahili'],['en','Anglais']],'fr')}</label></div><div class="actions"><button class="btn" data-act="psave">Appliquer au portail</button>${PRES?'<button class="btn" data-act="preset">Réinitialiser l\'aperçu</button>':''}</div></section>
 </div></div>`};
function sessFor(un,m){const n=pick(onlineNas());S.sessions.unshift({id:id(),user:un,ip:n.ip.replace(/\.1$/,'.')+(30+Math.floor(Math.random()*200)),mac:m||mac(),nas:n.name,start:Date.now(),inMB:.1,outMB:.05});return n}
function freeConnect(){const p=S.plans.find(x=>x.free),m=mac(),un='gratuit-'+m.slice(-5).replace(':','').toLowerCase();
 S.users.unshift({id:id(),username:un,password:'',plan:p.id,phone:'',mac:m,created:Date.now(),expires:Date.now()+DAY,status:'actif',used:0,source:'Gratuit (pub)'});
 const n=sessFor(un,m);log('radius',`Accès gratuit ${un} sur ${n.name} après publicité`);
 PRES=`<p class="msg s">Vous êtes connecté gratuitement.</p><div style="font-size:.9rem;display:flex;flex-direction:column;gap:4px"><span>Temps : ${S.free.min} min</span><span>Volume : ${S.free.mb} Mo</span><span>Débit : 1 Mbit/s</span></div><p class="hint">Besoin de plus ? Forfaits à partir de ${fc(Math.min(...S.plans.filter(x=>!x.free).map(x=>x.price)))}.</p><button type="button" class="go" data-act="preset">Nouvel essai</button>`}

/* ---------- Analytique visiteurs ---------- */
function colChart(vals){const W=640,H=200,L=40,B=24,T=8,R=6,mx=Math.ceil(Math.max(...vals)/20)*20,bw=(W-L-R)/vals.length,y=v=>H-B-(v/mx)*(H-B-T);let g='';
 [0,mx/2,mx].forEach(v=>g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
 vals.forEach((v,i)=>{const x=L+i*bw+bw*.15;g+=`<rect class="b1" x="${x}" y="${y(v)}" width="${bw*.7}" height="${y(0)-y(v)}" rx="2"><title>${i} h : ${v} connexions</title></rect>`;if(i%3===0)g+=`<text x="${x+bw*.35}" y="${H-7}" text-anchor="middle">${i}h</text>`});
 return`<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Connexions moyennes par heure">${g}</svg></div>`}
VIEWS.analytique=()=>{const tot=S.nas.reduce((a,n)=>a+n.visits,0),ret=Math.round(S.nas.reduce((a,n)=>a+n.visits*n.ret,0)/tot),mh=Math.max(...S.hours);
 return head('Analytique visiteurs','Fréquentation des hotspots sur 30 jours, calculée à partir des sessions RADIUS et des adresses MAC.')+
 `<div class="kpis"><div class="kpi"><span>Visiteurs uniques</span><b>${tot.toLocaleString('fr-FR')}</b><small>appareils distincts</small></div><div class="kpi"><span>Visiteurs fidèles</span><b>${ret} %</b><small>venus au moins 2 fois</small></div><div class="kpi"><span>Durée moyenne</span><b>47 min</b><small>par session</small></div><div class="kpi"><span>Heure de pointe</span><b>${S.hours.indexOf(mh)} h</b><small>${mh} connexions en moyenne</small></div></div>
 <section class="panel"><h2>Connexions moyennes par heure</h2>${colChart(S.hours)}</section>
 <div class="grid2"><section class="panel"><h2>Fréquentation par site</h2>${tbl(['Site','Routeur','Visiteurs','Fidèles','Nouveaux'],S.nas.map(n=>[esc(n.zone),esc(n.name),`<span class="num">${n.visits.toLocaleString('fr-FR')}</span>`,`<span class="num">${n.ret} %</span>`,`<span class="num">${100-n.ret} %</span>`]))}</section>
 <section class="panel"><h2>Types d'appareils</h2>${S.devices.map(([k,v])=>HB(k,v,100,v+' %')).join('')}<p class="note">Le type d'appareil est déduit du fabricant de l'adresse MAC et de l'agent du navigateur sur le portail.</p></section></div>`};

 <section class="panel">${tbl(['Borne','Site','Modèle','Canaux 2,4 / 5 GHz','Clients','Charge','Firmware','État',''],S.aps.map(a=>[`<b>${esc(a.name)}</b><br><small class="muted mono">${a.mac}</small>`,esc(a.nas),esc(a.model),`<span class="mono">${a.ch}</span>`,`<span class="num">${a.clients}</span>`,a.up?`<span class="meter"><i class="${a.util>80?'hi':''}" style="width:${a.util}%"></i></span><span class="num">${a.util} %</span>`:'—',`<span class="mono">${a.fw}</span>`,a.up?pill('En service','ok'):pill('Injoignable','bad'),`<div class="row-act"><button class="btn sm" data-act="apreboot" data-id="${a.id}">Redémarrer</button></div>`]))}</section>

const PAGE=25,SORTS={};let enR;
function numOf(x){const d=x.match(/^(\d{2})\/(\d{2})(?:\/(\d{4}))?(?:\s+(\d{2}):(\d{2}))?/);if(d)return(+(d[3]||new Date().getFullYear()))*1e8+(+d[2])*1e6+(+d[1])*1e4+(+(d[4]||0))*100+(+(d[5]||0));
 const m=x.replace(/[  ]/g,' ').match(/^([−-]?\d[\d ]*(?:,\d+)?)\s*(j|h|min|Go|Mo)?/);if(!m)return null;const v=parseFloat(m[1].replace(/ /g,'').replace(',','.').replace('−','-'));return v*({j:1440,h:60,Go:1024}[m[2]]||1)}
function cmp(a,b){const x=numOf(a),y=numOf(b);if(x!=null&&y!=null)return x-y;return a.localeCompare(b,'fr',{numeric:true})}
function enhance(){document.querySelectorAll('#main table').forEach((t,ti)=>{if(t.dataset.enh)return;t.dataset.enh='1';const tb=t.tBodies[0];if(!tb||!t.tHead)return;const key=cur+':'+ti;t._key=key;if(tb.rows.length<2)return;
 if(!t.classList.contains('perm'))[...t.tHead.rows[0].cells].forEach((th,ci)=>{if(!th.textContent.trim())return;th.classList.add('sortable');th.tabIndex=0;th.setAttribute('aria-sort','none');const act=()=>{const o=SORTS[key]||{};const dir=o.ci===ci&&o.dir===1?-1:1;SORTS[key]=Object.assign(o,{ci,dir});sortT(t,ci,dir)};th.addEventListener('click',act);th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}})});
 const o=SORTS[key]||{};t._shown=o.shown||PAGE;if(o.ci!=null)sortT(t,o.ci,o.dir);else page(t)})}
function sortT(t,ci,dir){const tb=t.tBodies[0];[...t.tHead.rows[0].cells].forEach((x,i)=>{if(x.classList.contains('sortable'))x.setAttribute('aria-sort',i===ci?(dir>0?'ascending':'descending'):'none')});[...tb.rows].sort((a,b)=>cmp((a.cells[ci]?.textContent||'').trim(),(b.cells[ci]?.textContent||'').trim())*dir).forEach(r=>tb.appendChild(r));page(t)}
function page(t){const rs=[...t.tBodies[0].rows];rs.forEach((r,i)=>r.hidden=i>=t._shown);const wrap=t.parentElement;let pg=wrap.nextElementSibling;if(!pg||!pg.classList.contains('pager')){if(rs.length<=PAGE)return;pg=document.createElement('div');pg.className='pager';wrap.after(pg)}const left=rs.length-t._shown;pg.innerHTML=left>0?`<button type="button" class="btn sm">Afficher ${Math.min(PAGE,left)} de plus (${left} restantes)</button>`:'';const b=pg.querySelector('button');if(b)b.onclick=()=>{t._shown+=PAGE;SORTS[t._key]=Object.assign(SORTS[t._key]||{},{shown:t._shown});page(t)}}
